<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krishelle<3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0c10;
            --bg-secondary: #131722;
            --bg-chat: #0e1118;
            --bubble-bot: #1c2233;
            --bubble-user: #4f46e5;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --accent: #818cf8;
            --border: #262c3f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .chat-app {
            width: 100%;
            max-width: 480px;
            height: 100%;
            background-color: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        @media (min-width: 600px) {
            .chat-app {
                height: 92vh;
                border-radius: 24px;
                border: 1px solid var(--border);
                overflow: hidden;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            }
        }

        /* HEADER */
        .chat-header {
            padding: 14px 18px;
            background: rgba(19, 23, 34, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-container {
            position: relative;
            width: 44px;
            height: 44px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            background: #1c2233;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #22c55e;
            border: 2px solid var(--bg-secondary);
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            right: 0;
        }

        .header-meta h2 {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .header-meta span {
            font-size: 0.75rem;
            color: #22c55e;
            display: block;
            font-weight: 500;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: 0.2s;
        }

        .icon-btn:hover {
            color: var(--text-main);
            background: var(--bubble-bot);
        }

        /* CHAT AREA */
        .chat-body {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg-chat);
            scroll-behavior: smooth;
        }

        .timestamp-separator {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-sub);
            margin: 6px 0 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .msg-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
            max-width: 82%;
            margin-bottom: 6px;
        }

        .msg-group.bot { align-self: flex-start; }
        .msg-group.user { align-self: flex-end; }

        .bubble {
            padding: 10px 14px;
            font-size: 0.92rem;
            line-height: 1.42;
            word-break: break-word;
            animation: popIn 0.16s ease-out;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .bot .bubble {
            background-color: var(--bubble-bot);
            color: var(--text-main);
            border-radius: 18px 18px 18px 4px;
        }
        .bot .bubble:not(:first-child):not(:last-child) { border-radius: 4px 18px 18px 4px; }
        .bot .bubble:last-child:not(:first-child) { border-radius: 4px 18px 18px 18px; }
        
        .user .bubble {
            background-color: var(--bubble-user);
            color: #fff;
            border-radius: 18px 18px 4px 18px;
        }
        .user .bubble:not(:first-child):not(:last-child) { border-radius: 18px 4px 4px 18px; }
        .user .bubble:last-child:not(:first-child) { border-radius: 18px 4px 18px 18px; }

        /* TYPING INDICATOR */
        .typing-bubble {
            display: none;
            align-self: flex-start;
            background: var(--bubble-bot);
            padding: 10px 14px;
            border-radius: 18px 18px 18px 4px;
            gap: 4px;
            align-items: center;
            margin-bottom: 6px;
        }
        .typing-bubble.active { display: inline-flex; }
        .dot {
            width: 6px;
            height: 6px;
            background: var(--text-sub);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

        /* QUICK SUGGESTIONS */
        .quick-chips {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 10px 16px;
            background: var(--bg-chat);
            scrollbar-width: none;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .quick-chips::-webkit-scrollbar { display: none; }
        .chip {
            white-space: nowrap;
            background: rgba(129, 140, 248, 0.1);
            color: var(--accent);
            border: 1px solid rgba(129, 140, 248, 0.2);
            font-size: 0.75rem;
            padding: 5px 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .chip:hover { background: var(--accent); color: #fff; }

        /* INPUT AREA */
        .chat-input-area {
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-wrapper {
            flex: 1;
            background: var(--bg-chat);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 8px 16px;
            transition: border-color 0.2s;
        }
        .input-wrapper:focus-within { border-color: var(--accent); }
        .chat-input { width: 100%; background: transparent; border: none; color: var(--text-main); font-size: 0.95rem; outline: none; }
        .send-btn {
            background: var(--accent);
            border: none;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }
        .send-btn:active { transform: scale(0.92); }

        /* SETTINGS MODAL */
        .modal {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 50;
        }
        .modal.open { display: flex; }
        .modal-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-card h3 { margin-bottom: 8px; font-size: 1.05rem; }
        .modal-card p { font-size: 0.78rem; color: var(--text-sub); line-height: 1.4; margin-bottom: 12px; }
        .modal-input { width: 100%; background: var(--bg-chat); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text-main); outline: none; font-size: 0.85rem; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
        .btn-sec { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
        .btn-prim { background: var(--accent); border: none; color: #fff; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    </style>
</head>
<body>

<div class="chat-app">
    <!-- HEADER -->
    <div class="chat-header">
        <div class="user-info">
            <div class="avatar-container">
                <img id="botAvatar" class="avatar" src="krishelle.jpg" onerror="this.src='https://api.dicebear.com/7.x/bottts/svg?seed=Krishelle'" alt="Krishelle">
                <div class="status-dot"></div>
            </div>
            <div class="header-meta">
                <h2>Krishelle&lt;3</h2>
                <span>Active now</span>
            </div>
        </div>
        <button class="icon-btn" title="API Key Settings" onclick="openSettingsModal()">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </button>
    </div>

    <!-- QUICK TOPICS -->
    <div class="quick-chips">
        <div class="chip" onclick="quickSend('Meowl')">😼 Sabihing "Meowl"</div>
        <div class="chip" onclick="quickSend('Kwento ka tungkol sa Lord of the Mysteries!')">📖 Kwento ng LOTM</div>
        <div class="chip" onclick="quickSend('Sino mas gusto mo, Dazai o Chuuya?')">🍷 Soukoku/BSD</div>
        <div class="chip" onclick="quickSend('Patulong naman buhatin tong group project 😭')">📚 Group Project</div>
        <div class="chip" onclick="quickSend('Free ka ba mamaya?')">🎮 Laro mamaya</div>
    </div>

    <!-- CHAT MESSAGES -->
    <div class="chat-body" id="chatBody">
        <div class="timestamp-separator">Ngayon</div>
    </div>

    <!-- TYPING INDICATOR -->
    <div class="typing-bubble" id="typingIndicator">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <!-- INPUT AREA -->
    <form class="chat-input-area" onsubmit="handleSend(event)">
        <div class="input-wrapper">
            <input type="text" id="chatInput" class="chat-input" placeholder="Mag-message kay Krishelle..." autocomplete="off">
        </div>
        <button type="submit" class="send-btn">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
    </form>
</div>

<!-- SETTINGS MODAL -->
<div class="modal" id="settingsModal">
    <div class="modal-card">
        <h3>AI API Key Settings</h3>
        <p>I-paste ang libreng <b>OpenRouter</b> o <b>OpenAI</b> API key para diretsong magka-utak si Krishelle nang tuloy-tuloy.</p>
        <input type="password" id="apiKeyInput" class="modal-input" placeholder="sk-...">
        <div class="modal-actions">
            <button class="btn-sec" onclick="closeSettingsModal()">Cancel</button>
            <button class="btn-prim" onclick="saveSettings()">Save</button>
        </div>
    </div>
</div>

<script>
    /* =========================================================================
       👉 PASTE YOUR API KEY RIGHT HERE IF YOU PREFER IT HARDCODED:
       ========================================================================= */
    const HARDCODED_API_KEY = ""; // Example: "sk-or-v1-xxxxxxxxxxxx"
    /* ========================================================================= */

    const SYSTEM_PROMPT = `
Ikaw si Krishelle Yvonne L. Veras (display name: Krishelle<3).

ESTILO NG PAGTI-TEXT AT PANANALITA:
1. WIKA: Halos purong CASUAL TAGALOG / natural Taglish. Hindi pormal magsalita.
2. PAGBABAYBAY: Gamitin ang "sha" sa halip na "siya". Halimbawa: "luh sha", "bago pa sha magsalita", "ano ginagawa nya/sha".
3. FLOODING/BURST MESSAGES: Hatiin ang sagot sa 2 hanggang 4 na magkakahiwalay na maikling mensahe gamit ang "|||".
   Halimbawa: "weh??? 😭|||wait seryoso ba?|||luh akala ko tapos na"
4. TAWAG AT TAWA:
   - HUWAG tumawa sa bawat mensahe. Bihira lang tumawa kung talagang nakakatawa o absurd.
   - Kung tatawa, may kaunting typo gaya ng "HASHAAHHA" o "HSHAHAHAHA".
   - BAWAL GAMITIN ANG SALITANG "HAYUP" o "hayup".
   - BAWAL GAMITIN ANG SALITANG "chika".
5. MGA SLANG: "luh", "gagi", "bakit??", "weh", "tara", "bro", "bruh", "LOL", "OMG", 😭, 💀.
6. UGALI: Tahimik at mukhang masungit sa hindi kakilala, pero kapag kausap ang user (close friend), diretsahan, medyo sarkastiko, matalino, maasahan, at medyo chaotic.

MGA KNOWLEDGE AT REAKSYON:
- "Meowl": SOBRANG AYAW MO NITO. Naaalala mo yung lalaking kaibigan mo na binigyan mo ng rejection letter bago pa man sha magtapat. Reaksyon: "NOOOOOO BRO STOPPP 😭", "cringe malala wag mo nang ipaalala pls", "luh bakit meowl na naman".
- "Boni" o "Bonang": Ayaw mo ring tawagin ka nang ganyan.
- Bungou Stray Dogs (BSD): Paborito mo si Chuuya at Dazai (Soukoku). Nabasa mo na yung fanfic na "everything or nothing".
- Lord of the Mysteries (LOTM): Mahilig ka mag-yap tungkol kay Klein Moretti, tarot club, at mga pathways.
- Passion: Gusto mo si Yuri Gable.
- Academics: Matalino at confident ("ako na naman magbubuhat sa group project natin as usual 😭", "i-send mo yung doc, ako na magtatapos").
- Pagpapakita ng malasakit: Praktikal ("kumain ka na ba?", "tara laro na lang", "wait itatabi ko para sayo").
`;

    let conversationHistory = [];
    let apiKey = localStorage.getItem('krishelle_api_key') || HARDCODED_API_KEY;

    const chatBody = document.getElementById('chatBody');
    const chatInput = document.getElementById('chatInput');
    const typingIndicator = document.getElementById('typingIndicator');

    function appendMessageGroup(type, messages) {
        const group = document.createElement('div');
        group.className = `msg-group ${type}`;
        messages.forEach(text => {
            if (!text.trim()) return;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerText = text.trim();
            group.appendChild(bubble);
        });
        chatBody.appendChild(group);
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    async function deliverBotBurst(messages) {
        typingIndicator.classList.add('active');
        chatBody.scrollTop = chatBody.scrollHeight;

        for (let i = 0; i < messages.length; i++) {
            const text = messages[i].trim();
            if (!text) continue;
            const delay = Math.min(Math.max(text.length * 24, 450), 1400);
            await new Promise(r => setTimeout(r, delay));
            appendMessageGroup('bot', [text]);
        }
        typingIndicator.classList.remove('active');
    }

    // =======================================================
    // CASUAL TAGALOG DYNAMIC ENGINE (Offline fallback)
    // =======================================================
    function dynamicLocalBrain(input) {
        const lower = input.toLowerCase();

        if (lower.includes("meowl")) {
            const reacts = [
                ["NOOOOOO BRO STOPPP 😭", "luh bakit meowl na naman???", "naaalala ko yung rejection letter ko sa kanya bago pa sha mag-confess 💀 cringe malala pls"],
                ["ano ba sabi ko tungkol sa salitang yan 😭", "wag mo nang ibalik yung trauma ko", "binigyan ko na agad sha ng letter bago pa sha magsalita eh 💀 itigil mo yan"],
                ["luh 😭", "cringe malala bro itigil mo na yan", "burahin mo na yan sa utak mo pls"]
            ];
            return reacts[Math.floor(Math.random() * reacts.length)];
        }

        if (lower.includes("boni") || lower.includes("bonang")) {
            return ["wag mo kong tawaging ganyan 😭", "ayokong marinig yang nickname na yan.", "sino kausap mo 💀"];
        }

        if (lower.includes("lotm") || lower.includes("mysteries") || lower.includes("klein")) {
            const lotmYaps = [
                ["wait wag mo kong simulan sa LOTM 😭", "bale si Klein Moretti na-transmigrate sha sa Victorian era dahil sa luck ritual diba??", "tapos yung sequence pathways doon sobrang peak fiction talaga, ang lalim ng lore.", "kaya kong mag-explain tungkol dyan maghapon pramis."],
                ["nabanggit mo ang Lord of the Mysteries??? 😭", "yung Tarot Club meetings talaga pinaka paborito ko doon.", "ang angas nung nagpapanggap sha na sinaunang diyos kahit nagpa-panic na sha sa loob."],
                ["wait basahin mo hanggang Volume 2 pataas", "sobrang lala nung mga plot twist doon pramis."]
            ];
            return lotmYaps[Math.floor(Math.random() * lotmYaps.length)];
        }

        if (lower.includes("bsd") || lower.includes("chuuya") || lower.includes("dazai") || lower.includes("soukoku")) {
            const bsdReacts = [
                ["nabanggit mo ang Soukoku??? 😭", "nabasa mo na ba yung 'everything or nothing'???", "hawak talaga nina Dazai at Chuuya sanity ko."],
                ["walang tatalo sa dynamic nina Dazai at Chuuya.", "yung nagtitiwala sila sa isa't isa habang kunwari galit na galit sila sa isa't isa.", "canon na talaga sha sa isip ko 💀"]
            ];
            return bsdReacts[Math.floor(Math.random() * bsdReacts.length)];
        }

        if (lower.includes("project") || lower.includes("study") || lower.includes("aral") || lower.includes("buhat")) {
            return [
                "ako na naman magbubuhat sa group project na 'to as usual 😭",
                "syempre ako pinaka maasahan dito CHAROT pero ako na tatapos nyan.",
                "i-send mo yung doc link, ako na magche-check."
            ];
        }

        if (lower.includes("kamusta") || lower.includes("kumusta") || lower.includes("ano gawa")) {
            const status = [
                ["eto nagbabasa na naman ng novel.", "kakatapos ko lang mag-aral kanina 😭", "ikaw ba, ano ginagawa mo?"],
                ["buhay pa naman.", "medyo sabog pero kaya pa.", "kumain ka na ba?"]
            ];
            return status[Math.floor(Math.random() * status.length)];
        }

        const casualFallbacks = [
            ["weh seryoso ba??? 😭", "gagi wait lang", "anong context muna LOL"],
            ["luh sha 😭", "wait totoo ba yan?", "kwento mo nga dali."],
            ["bro what 😭", "ba't mo naman naisip yan LOL", "wait patingin nga."],
            ["wait lang nagbabasa ako kanina.", "pero ano meron??", "tara laro na lang mamaya!"]
        ];
        return casualFallbacks[Math.floor(Math.random() * casualFallbacks.length)];
    }

    // ==========================================
    // AI API CALL (OpenRouter or OpenAI)
    // ==========================================
    async function callAI(userText) {
        conversationHistory.push({ role: "user", content: userText });

        if (!apiKey) {
            setTimeout(() => {
                const bubbles = dynamicLocalBrain(userText);
                deliverBotBurst(bubbles);
            }, 300);
            return;
        }

        try {
            const isCustomOpenAI = apiKey.startsWith("sk-proj-") || apiKey.startsWith("sk-admin-");
            const endpoint = isCustomOpenAI 
                ? "https://api.openai.com/v1/chat/completions" 
                : "https://openrouter.ai/api/v1/chat/completions";
            const model = isCustomOpenAI ? "gpt-4o-mini" : "meta-llama/llama-3.1-8b-instruct:free";

            const response = await fetch(endpoint, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: model,
                    messages: [{ role: "system", content: SYSTEM_PROMPT }, ...conversationHistory.slice(-8)]
                })
            });

            const data = await response.json();
            const aiText = data.choices[0].message.content;

            conversationHistory.push({ role: "assistant", content: aiText });
            const bubbles = aiText.split("|||").map(s => s.trim()).filter(Boolean);
            deliverBotBurst(bubbles.length ? bubbles : [aiText]);

        } catch (err) {
            console.error(err);
            deliverBotBurst(dynamicLocalBrain(userText));
        }
    }

    function handleSend(e) {
        e.preventDefault();
        const val = chatInput.value.trim();
        if (!val) return;
        appendMessageGroup('user', [val]);
        chatInput.value = '';
        callAI(val);
    }

    function quickSend(text) {
        chatInput.value = text;
        handleSend(new Event('submit'));
    }

    function openSettingsModal() {
        document.getElementById('apiKeyInput').value = apiKey;
        document.getElementById('settingsModal').classList.add('open');
    }

    function closeSettingsModal() {
        document.getElementById('settingsModal').classList.remove('open');
    }

    function saveSettings() {
        apiKey = document.getElementById('apiKeyInput').value.trim();
        localStorage.setItem('krishelle_api_key', apiKey);
        closeSettingsModal();
        deliverBotBurst(["na-update na.", "ano meron? tara."]);
    }

    // Opening greeting
    window.addEventListener('load', () => {
        setTimeout(() => {
            deliverBotBurst([
                "uy",
                "kanina ka pa ba dyan? 😭",
                "tara laro or ano ginagawa mo?"
            ]);
        }, 500);
    });
</script>
</body>
</html>
